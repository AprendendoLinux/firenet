<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site em Manutenção - FireNet Telecom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; font-family: 'Montserrat', sans-serif;">
    <div class="container text-center">
        <div class="card border-0 shadow-lg rounded-4 p-5 mx-auto" style="max-width: 600px;">
            
            <img src="{{ url_for('static', filename='logo.png') }}" alt="FireNet Telecom" class="img-fluid mb-4 mx-auto" style="max-height: 80px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));">
            
            <div class="text-danger mb-4">
                <i class="fas fa-tools fa-5x"></i>
            </div>
            
            <h1 class="fw-bold text-dark mb-3">Site em Manutenção</h1>
            
            <p class="text-muted fs-5 mb-4">
                Estamos realizando algumas atualizações no sistema para melhorar a sua experiência. 
                Por favor, tente novamente mais tarde.
            </p>
            
            <p class="text-muted small mb-0">
                Agradecemos a sua compreensão! <br>
                <strong>Equipe FireNet Telecom</strong>
            </p>
            
        </div>
    </div>
</body>
</html>
